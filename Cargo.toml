[package]
name = "ripgrep-tui"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A user-friendly TUI wrapper for ripgrep with enhanced discoverability"
license = "MIT"

[dependencies]
# GUI framework
eframe = "0.27"
egui = "0.27"
egui_extras = { version = "0.27", features = ["file", "image"] }

# CLI argument parsing (for optional CLI mode)
clap = { version = "4.5", features = ["derive", "cargo"] }

# Process execution
tokio = { version = "1.35", features = ["full"] }

# Serialization for config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = "0.4"
dirs = "5.0"
regex = "1.10"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
